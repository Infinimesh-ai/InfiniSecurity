[workspace]
resolver = "2"
members = [
    "crates/infsec-common",
    "crates/infinisecd",
    "crates/infsec",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Infinimesh-ai/InfiniSecurity"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"

[profile.release]
lto = true
strip = "symbols"
